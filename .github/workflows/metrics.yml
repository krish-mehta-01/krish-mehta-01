# Regenerates the profile card with lowlighter/metrics.
# Needs a repo secret METRICS_TOKEN: a classic personal access token with
# the `repo` and `read:user` scopes.
#
# Only plugins that work against today's GitHub API are enabled. habits,
# activity and achievements currently crash upstream (GitHub retired classic
# Projects and changed event payloads), so they are left out on purpose.
name: Metrics
on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Profile card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          base: header, activity, community, repositories
          plugins_errors_fatal: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, jupyter notebook, plpgsql, dockerfile, kotlin

          plugin_repositories: yes
          plugin_repositories_featured: healthconnect-pro, Fake-News-Detection-Verification-Tool, Amdox-AI-Optimizer-Internship, KrishMehta-QSkill-AI-ML
