# Render's free plan sleeps the krishmehta.xyz backend after ~15 idle minutes,
# which makes the first chat message on the site wait ~30s. A light ping every
# 10 minutes keeps it warm. Lives here because public-repo Actions are free.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://krishmehta-backend.onrender.com/api/chat/health
