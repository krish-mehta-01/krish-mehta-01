# Rebuilds the profile images daily (activity strip uses live GitHub data).
# Uses the METRICS_TOKEN secret (classic PAT: repo, read:user) so private
# contributions count toward the totals.
name: Profile
on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build images
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "Refresh profile images" && git push
