<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Krish Mehta — I build technology for the people it usually forgets.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1effa"/><stop offset="1" stop-color="#e3ddf7"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#d9ccff"/>
      <stop offset="0.6" stop-color="#f6c8ec"/>
      <stop offset="0.85" stop-color="#bcd8ff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e6ddff"/>
      <stop offset="0.8" stop-color="#f3cdec"/>
      <stop offset="1" stop-color="#b9d3ff"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <g opacity="0.9" filter="url(#soft)">
      <circle cx="1040" cy="40" r="150" fill="#cfc3ff"/>
      <circle cx="1200" cy="250" r="120" fill="#f5cbe9"/>
      <circle cx="860" cy="300" r="110" fill="#c3d8ff"/>
    </g>
    <!-- glass ring + pearl, echoing the site's 3D objects -->
    <g transform="translate(1010 165) rotate(-24)">
      <ellipse rx="128" ry="62" fill="none" stroke="url(#iri)" stroke-width="30" opacity="0.92"/>
      <ellipse rx="128" ry="62" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" transform="translate(0 -9)"/>
    </g>
    <circle cx="1182" cy="92" r="34" fill="url(#pearl)"/>
    <ellipse cx="1172" cy="80" rx="10" ry="6" fill="#ffffff" opacity="0.85"/>
    <circle cx="872" cy="248" r="16" fill="url(#pearl)"/>

    <text x="72" y="92" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,monospace" font-size="15" letter-spacing="2" fill="#5d5b70">SHIMLA → CHENNAI · B.TECH (HONS) IT · RMKEC</text>
    <text x="68" y="182" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="700" letter-spacing="-3" fill="#121218">Krish Mehta</text>
    <text x="72" y="238" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="-0.6" fill="#121218" opacity="0.86">I build technology for <tspan font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-style="italic" font-size="34" fill="#5a48f5" letter-spacing="0">the people it usually forgets.</tspan></text>
    <rect x="0.5" y="0.5" width="1279" height="319" rx="28" fill="none" stroke="rgba(255,255,255,0.9)"/>
  </g>
</svg>
